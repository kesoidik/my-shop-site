<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать в мой магазин!</h1>
        <p class="subtitle">Это мой первый сайт на .shop домене</p>
        
        <div class="buttons-grid">
            <button class="custom-btn">
                <span>Товары</span>
            </button>
            <button class="custom-btn">
                <span>О нас</span>
            </button>
            <button class="custom-btn">
                <span>Контакты</span>
            </button>
            <button class="custom-btn">
                <span>Доставка</span>
            </button>
            <button class="custom-btn">
                <span>Скидки</span>
            </button>
            <button class="custom-btn">
                <span>Отзывы</span>
            </button>
        </div>

        <p id="message" class="message"></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
